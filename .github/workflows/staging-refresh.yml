name: Staging DB Refresh + Mask

env:
  PROD_DBHOST: ${{ secrets.PROD_DBHOST }}
  PROD_DBUSER: ${{ secrets.PROD_DBUSER }}
  PROD_DBNAME: ${{ secrets.PROD_DBNAME }}
  PROD_DBPORT: ${{ secrets.PROD_DBPORT }}
  STAGING_DBHOST: ${{ secrets.STAGING_DBHOST }}
  STAGING_DBUSER: ${{ secrets.STAGING_DBUSER }}
  STAGING_DBNAME: ${{ secrets.STAGING_DBNAME }}
  STAGING_DBPORT: ${{ secrets.STAGING_DBPORT }}

on:
  schedule:
    - cron: "0 0 * * *" # 3am EAT
  workflow_dispatch:

jobs:
  refresh-staging-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install PostgreSQL 18 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Safety guard - refuse if staging host equals prod host
        run: |
          if [ "$STAGING_DBHOST" = "$PROD_DBHOST" ]; then
            echo "ABORT: staging host equals prod host"; exit 1
          fi

      - name: Dump prod (read-only)
        env:
          PGPASSWORD: ${{ secrets.PROD_DBPASS }}
        run: |
          pg_dump -h "$PROD_DBHOST" -U "$PROD_DBUSER" -p "$PROD_DBPORT" \
            -d "$PROD_DBNAME" -Fc -f /tmp/prod_seed.dump
          ls -lh /tmp/prod_seed.dump

      - name: Kill active connections to staging
        env:
          PGPASSWORD: ${{ secrets.STAGING_DBPASS }}
        run: |
          psql -h "$STAGING_DBHOST" -U "$STAGING_DBUSER" -p "$STAGING_DBPORT" \
            -d "$STAGING_DBNAME" -c \
            "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '$STAGING_DBNAME' AND pid <> pg_backend_pid();"

      - name: Restore into staging (replace previous)
        env:
          PGPASSWORD: ${{ secrets.STAGING_DBPASS }}
        run: |
          pg_restore -h "$STAGING_DBHOST" -U "$STAGING_DBUSER" -p "$STAGING_DBPORT" \
            -d "$STAGING_DBNAME" --clean --if-exists --no-owner --no-privileges \
            /tmp/prod_seed.dump

      - name: Mask students
        env:
          PGPASSWORD: ${{ secrets.STAGING_DBPASS }}
        run: |
          psql -v ON_ERROR_STOP=1 -h "$STAGING_DBHOST" -U "$STAGING_DBUSER" \
            -p "$STAGING_DBPORT" -d "$STAGING_DBNAME" -f scripts/db/masking/mask_students.sql

      - name: Mask schools
        env:
          PGPASSWORD: ${{ secrets.STAGING_DBPASS }}
        run: |
          psql -v ON_ERROR_STOP=1 -h "$STAGING_DBHOST" -U "$STAGING_DBUSER" \
            -p "$STAGING_DBPORT" -d "$STAGING_DBNAME" -f scripts/db/masking/mask_schools.sql

      - name: Validate masking (gate)
        env:
          PGPASSWORD: ${{ secrets.STAGING_DBPASS }}
        run: |
          psql -v ON_ERROR_STOP=1 -h "$STAGING_DBHOST" -U "$STAGING_DBUSER" \
            -p "$STAGING_DBPORT" -d "$STAGING_DBNAME" -f scripts/db/masking/validate_masking.sql

      - name: Cleanup dump (contains real PII)
        if: always()
        run: shred -u /tmp/prod_seed.dump 2>/dev/null || rm -f /tmp/prod_seed.dump