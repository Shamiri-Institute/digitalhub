name: Setup
description: Bun and node_modules restored from cache, plus Playwright's browser when asked.
inputs:
  browsers:
    description: Install Chromium for Playwright
    default: "false"
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json
    - uses: actions/setup-node@v6
      with:
        node-version: "24"
    # node_modules itself, keyed on the lockfile. Pushes to dev and main save it, and pull requests
    # read their base branch's copy, so a PR that leaves bun.lock alone never installs.
    - id: modules
      uses: actions/cache@v5
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
    - if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: bun install --frozen-lockfile
    - if: inputs.browsers == 'true'
      id: playwright
      shell: bash
      run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
    # Keyed on the OS image too: a browser cached on one Ubuntu release may lack libraries on another.
    - if: inputs.browsers == 'true'
      id: browsers
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ steps.playwright.outputs.version }}
    - if: inputs.browsers == 'true' && steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: bunx playwright install --with-deps --only-shell chromium
    - if: inputs.browsers == 'true' && steps.browsers.outputs.cache-hit == 'true'
      shell: bash
      run: bunx playwright install-deps chromium
