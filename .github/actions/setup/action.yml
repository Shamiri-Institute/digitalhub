name: Setup
description: Node and pnpm, node_modules restored from cache, plus Playwright's browser when asked.
inputs:
  browsers:
    description: Install Chromium for Playwright
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: "24"
    - id: package-manager
      shell: bash
      run: echo "version=$(node -p 'require("./package.json").packageManager')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v5
      with:
        path: ~/.cache/node/corepack
        key: corepack-${{ runner.os }}-${{ steps.package-manager.outputs.version }}
    - shell: bash
      run: corepack enable && corepack install
    # Pull requests restore the copy that pushes to dev and main save.
    - id: modules
      uses: actions/cache@v5
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
    # Lockfile changes miss node_modules; restore a previous store so pnpm only fetches the delta.
    - if: steps.modules.outputs.cache-hit != 'true'
      id: pnpm-store-path
      shell: bash
      run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
    - if: steps.modules.outputs.cache-hit != 'true'
      uses: actions/cache@v5
      with:
        path: ${{ steps.pnpm-store-path.outputs.dir }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ runner.arch }}-
    - if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
    - if: inputs.browsers == 'true'
      id: playwright
      shell: bash
      run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
    # A browser cached on one Ubuntu release may lack libraries on another.
    - if: inputs.browsers == 'true'
      id: browsers
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ steps.playwright.outputs.version }}
    - if: inputs.browsers == 'true' && steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps --only-shell chromium
    - if: inputs.browsers == 'true' && steps.browsers.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm exec playwright install-deps chromium
