name: SeaweedFS
description: Starts the S3 server developers run (scripts/local-s3.sh), in the background; wait for "S3 ready" in seaweedfs.log before using it.
runs:
  using: composite
  steps:
    # The same script as in development, so request signatures are checked here too.
    - shell: bash
      run: |
        curl -fsSLo seaweedfs.tar.gz https://github.com/seaweedfs/seaweedfs/releases/download/4.52/linux_amd64.tar.gz
        echo "8b538c22d47d0c3fb6792adaa6b0c735a967401270a53427d5a476dcaca9b7ae  seaweedfs.tar.gz" | sha256sum -c -
        sudo tar -xzf seaweedfs.tar.gz -C /usr/local/bin weed
        nohup scripts/local-s3.sh >seaweedfs.log 2>&1 &
